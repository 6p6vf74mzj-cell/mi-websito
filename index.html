<!DOCTYPE html>
<html>
<head>
    <title>Kosmische Affirmationen</title>
    <style>
        body {
            background-image: url("NASA.jpg");
            background-size:100% ;
            background-position: center;
            background-repeat: no-repeat; 
            background-attachment: fixed;
            background-color: black;
            color:aliceblue;
            min-height: 100vh;
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Here to give you a peaceful mind.</h1>
    <p>Whatever is on your mind -> this place hopefully gives you positive vibes...</p>
    <div id="frage1">
        <h2>How do you feel today?</h2>
        <button onclick="zeigeGefuele('good')">😊 Good</buttton>
        <button onclick="zeigeGefuele('bad')">😔 Bad</button>
        
    </div>

    <div id="frageGood"> sytle="display:none;"
        <h2>Please describe your feelings precisely.</h2>
        <button onclick="zeigeAffirmation(calm)">Calm</button>
        <button onclick="zeigeAffirmation(ambitious)">Ambitious</button>
        <button onclick="zeigeAffirmation(inspired)">Inspired</button>
    </div>

    <div id="frageBad"> style="display:none;"
        <h2>Please describe your feelings precisely.</h2>
        <button onclick="zeigeAffirmation(anxious)">Anxious</button>
        <button onclick="zeigeAffirmation(heartbroken)">Heartbroken</button>
        <button onclick="zeigeAffirmation(stressed)">Stressed</button>

    </div>

    <div id="ergebnis">

        <script>
            function zeigeGefuele(stimmung) {
                if (stimmung === 'good'){
                    document.getElementById("frageGood").style.display = "block";
                    document.getElementById("frageBad").style.display = "none";
                } else {
                    document.getElementById("frageBad").style.display = "block";
                    document.getElementById("frageGood").style.display = "none";
                }
                document.getElementById("frage1").style.display = "none";
            }

            function zeigeAffirmation(gefuel) {
                const affirmation = {
                    calm: "Just like the galaxies that surround softly eachother, I'll find my place in the big picture.",
                    ambitious: "Stars don't wait for permission to burn brighter. They collapse inward, gather their own gravity, and become supernovas. My drive is the same kind of force: quiet fuel becoming unstoppable light.",
                    inspired: "Right now, somewhere in me, a nebula is folding into itself, gathering scattered light into something new. This spark I feel is a star being born.",
                    anxious: "Against the scale of billions of light-years, I'm allowed to let loose of my worries for a moment.",
                    heartbroken: "Even collapsed stars don't disappear. They become the darkness that holds the light of others. What breaks in me makes room for what's coming.",
                    stressed: "Since stars shine bright under pressure, I also grow beacuse of the situations that challenge me."
                };

                document.getElementById("ergebnis").innerHTML =
                    "<p>" + affirmation[gefuel] + "</p>";
            }
        </script>
    </div>


</body>
</html>
