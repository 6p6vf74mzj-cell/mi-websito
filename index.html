    <div id="quiz">
        <h2>How do you feel today?</h2>
        <buttton onclick="zeigeAffirmation('ruhig')">Ruhig</buttton>
        <button onclick="zeigeAffirmation('unsicher')">Unsicher / Ängstlich</button>
        <button onclick="zeigeAffirmation"( 'gestresst')>Gestresst</button>

    <div id="ergebnis"></div>

    <script>
        function zeigeAffirmation(gefuel) {
            const affirmation = {
                ruhig: "Just like the galaxies that suround softly eachother, I'll find my place in the bg picture.",
                unsicher: "Against the scale of billions of light-years, I'm allowed to let loose of my worries for a moment.",
                gestresst: "Just like a star that shines brigth because of the pressure, I grow beacuse of the situations that challenge me."
            };

            document.getElementById("ergebnis")  .innerHTML = 
                "<p>" + affirmation[gefuel] + "</p>";
        }
